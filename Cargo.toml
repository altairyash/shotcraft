[package]
name = "shotcraft"
version = "0.1.0"
edition = "2024"
description = "A deterministic screenshot asset pipeline for developers and AI agents"
license = "MIT"
readme = "README.md"

[[bin]]
name = "shotcraft"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
